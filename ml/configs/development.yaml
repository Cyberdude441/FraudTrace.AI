# FraudTrace AI ML Configuration - Development & Experimentation (Colab)
seed: 42

data:
  version: "synthetic-v1"
  data_dir: "ml/data"
  sample_dir: "ml/data/sample"
  raw_dir: "ml/data/raw"
  processed_dir: "ml/data/processed"

model:
  type: "random_forest"
  n_estimators: 100
  max_depth: 6
  random_state: 42

training:
  test_size: 0.2
  cv_folds: 5
  eval_metric: "f1_macro"

thresholds:
  entity_match: 0.80
  contradiction: 0.70
  timestamp_drift_minutes: 4.0
  amount_tolerance_ratio: 0.01

confidence:
  one_source: "LOW"
  two_agreeing: "MEDIUM"
  three_agreeing: "HIGH"
  four_plus_agreeing: "VERY HIGH"
  conflict: "CONFLICTING"
  unsupported_threshold: 0.35

api:
  host: "0.0.0.0"
  port: 8000
  debug: true
